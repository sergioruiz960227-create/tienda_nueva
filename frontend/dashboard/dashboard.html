<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Nueva - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="container">
        <!-- MENÚ LATERAL -->
        <aside class="sidebar">
            <h2>TIENDA NUEVA</h2>
            <nav>
                <a href="#" class="menu-activo">Dashboard</a>
                <a href="#">Inventario</a>
                <a href="#">Ventas</a>
                <a href="#">Clientes</a>
                <a href="#">Créditos</a>
                <a href="#">Reportes</a>
                <a href="#">Usuarios</a>
                <a href="#">Configuración</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="header">
                <div class="header-izquierda">
                    <button class="btn-menu" id="btnMenu">☰</button>
                    <h1>Dashboard Principal</h1>
                </div>
                <div class="usuario">
                    <span>Administrador</span>
                    <a href="../index/index.html" id="cerrarSesion">Cerrar Sesión</a>
                </div>
            </header>

            <section class="cards">
                <div class="card">
                    <div>
                        <p id="rotuloVentasHoy">Ventas Hoy</p>
                        <h2>—</h2>
                    </div>
                    <div class="icono-card">💲</div>
                </div>
                <div class="card">
                    <div>
                        <p>Productos</p>
                        <h2>—</h2>
                    </div>
                    <div class="icono-card">📦</div>
                </div>
                <div class="card">
                    <div>
                        <p>Clientes</p>
                        <h2>—</h2>
                    </div>
                    <div class="icono-card">👤</div>
                </div>
                <div class="card">
                    <div>
                        <p>Stock Bajo</p>
                        <h2>—</h2>
                        <small class="nota-card" id="notaAgotados"></small>
                    </div>
                    <div class="icono-card">⚠️</div>
                </div>
            </section>

            <section class="tabla-container">
                <h3>Ventas Recientes</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Factura</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVentas">
                        <!-- Las ventas se cargan desde la API (dashboard.js) -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div class="overlay-menu" id="overlayMenu"></div>

    <script src="../js/api.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
