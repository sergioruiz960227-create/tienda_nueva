<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Nueva - Registrar Venta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="R_ventas.css">
</head>
<body>

    <div class="container">
        <!-- MENÚ LATERAL -->
        <aside class="sidebar">
            <h2>TIENDA NUEVA</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Inventario</a>
                <a href="#" class="menu-activo">Ventas</a>
                <a href="#">Clientes</a>
                <a href="#">Créditos</a>
                <a href="#">Reportes</a>
                <a href="#">Usuarios</a>
                <a href="#">Configuración</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <!-- HEADER -->
            <header class="header">
                <div class="header-izquierda">
                    <button class="btn-menu" id="btnMenu">☰</button>
                    <h1>Registrar Venta</h1>
                </div>
                <div class="usuario">
                    <span>Administrador</span>
                    <a href="../index/index.html" id="cerrarSesion">Cerrar Sesión</a>
                </div>
            </header>

            <!-- TARJETA FORMULARIO CENTRAL -->
            <section class="formulario-container">
                <div class="card-factura">
                    <div class="factura-header">
                        <h3>Información de Venta</h3>
                        <div class="icono-factura">📄</div>
                    </div>

                    <!-- CAMPOS SUPERIORES -->
                    <div class="grid-campos">
                        <div class="campo">
                            <label>Número de Factura</label>
                            <input type="text" id="numeroFactura" value="Se asigna al guardar" readonly class="input-desactivado">
                        </div>
                        <div class="campo">
                            <label>Fecha</label>
                            <input type="text" id="fechaVenta" value="" readonly class="input-desactivado">
                        </div>
                        <div class="campo">
                            <label>Cliente</label>
                            <select id="selectCliente">
                                <option value="" disabled selected>Seleccionar Cliente</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label>Método de pago</label>
                            <select id="selectMetodo">
                                <option value="" disabled selected>Seleccionar Método</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Tarjeta">Tarjeta</option>
                                <option value="Credito">Crédito</option>
                            </select>
                        </div>
                        <div class="campo" id="campoFechaLimite" style="display: none;">
                            <label>Fecha límite de pago (si la deja vacía: 30 días)</label>
                            <input type="date" id="fechaLimite">
                        </div>
                    </div>

                    <!-- TABLA DETALLE DE PRODUCTOS -->
                    <div class="detalle-productos">
                        <h4>Detalle de Productos</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Subtotal</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="detalleProductos">
                                <!-- Las filas se crean con R_ventas.js -->
                            </tbody>
                        </table>
                    </div>

                    <!-- BOTÓN AGREGAR Y TOTALES -->
                    <div class="factura-footer">
                        <button class="btn-agregar-prod" id="btnAgregarProducto">+ Agregar producto</button>
                        
                        <div class="bloque-totales">
                            <div class="fila-tot"><span>Subtotal:</span> <span id="totalSubtotal">$0</span></div>
                            <div class="fila-tot"><span>IVA (19%):</span> <span id="totalIva">$0</span></div>
                            <div class="fila-tot total-final"><span>Total:</span> <span id="totalGeneral">$0</span></div>
                        </div>
                    </div>

                    <!-- ACCIONES FINALES -->
                    <div class="botones-acciones">
                        <button class="btn-cancelar" id="btnCancelar">Cancelar</button>
                        <button class="btn-registrar-venta" id="btnRegistrarVenta">Registrar Venta</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="overlay-menu" id="overlayMenu"></div>

    <script src="../js/api.js"></script>
    <script src="R_ventas.js"></script>
</body>
</html>
